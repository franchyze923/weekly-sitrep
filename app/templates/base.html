<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Weekly Sitrep{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --bg:#f3f4f6; --panel:#ffffff; --line:#e5e7eb; --text:#111827; --muted:#6b7280;
      --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#dbeafe;
      --ok:#16a34a; --ok-soft:#dcfce7; --ok-text:#166534;
      --pending:#f59e0b; --pending-soft:#fef3c7; --pending-text:#92400e;
      --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
      --radius:14px;
    }
    :root[data-theme="dark"] {
      --bg:#0f1115; --panel:#181b22; --line:#262a33; --text:#e6e8ec; --muted:#8b919c;
      --accent:#4f8cff; --accent-hover:#6a9dff; --accent-soft:#1b2a4a;
      --ok:#34d399; --ok-soft:#0f2a20; --ok-text:#86efac;
      --pending:#fbbf24; --pending-soft:#2e2410; --pending-text:#fcd34d;
        --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
    * { box-sizing:border-box; }
    html { font-size:15px; }
    body { margin:0; font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
    a { color:var(--accent); }

    header { position:sticky; top:0; z-index:10; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:10px 20px; background:color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    header .brand { font-weight:700; font-size:16px; letter-spacing:-.01em; color:var(--text); text-decoration:none; white-space:nowrap; justify-self:center; }
    header .left { display:flex; align-items:center; gap:10px; justify-self:start; }
    header .arrow { font-size:20px; line-height:1; text-decoration:none; color:var(--text); width:34px; height:34px; display:grid; place-items:center; border-radius:10px; transition:background .15s; }
    header .arrow:hover { background:var(--line); }
    header .arrow.disabled { visibility:hidden; }
    header .week { font-weight:600; font-size:17px; letter-spacing:-.01em; }
    header .badge { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:3px 9px; }
    header nav { justify-self:end; display:flex; gap:18px; align-items:center; font-size:14px; }
    @media (max-width:700px) { header { grid-template-columns:1fr auto; } header .brand { grid-column:1 / -1; justify-self:center; order:-1; } }
    header nav a { color:var(--muted); text-decoration:none; font-weight:500; transition:color .15s; }
    header nav a:hover { color:var(--text); }
    button.theme { padding:6px; width:32px; height:32px; justify-content:center; color:var(--muted); }
    button.theme svg { width:16px; height:16px; }
    button.theme .moon { display:none; }
    :root[data-theme="dark"] button.theme .moon { display:block; }
    :root[data-theme="dark"] button.theme .sun { display:none; }

    body { display:flex; flex-direction:column; min-height:100vh; }
    main { padding:22px 20px 40px; max-width:1400px; margin:0 auto; width:100%; flex:1; }
    footer { text-align:center; font-size:12px; color:var(--muted); padding:16px 20px 20px; opacity:.8; }

    .progress { display:flex; align-items:center; gap:14px; margin:0 0 18px; font-size:14px; color:var(--muted); }
    .progress .bar { flex:none; width:220px; max-width:40vw; height:6px; background:var(--line); border-radius:999px; overflow:hidden; }
    .progress .bar span { display:block; height:100%; background:var(--ok); border-radius:999px; transition:width .4s ease; }

    .project { margin-bottom:22px; background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); border-left:4px solid var(--pending); padding:18px 20px 20px; transition:border-color .3s; }
    .project:has(.status.ok) { border-left-color:var(--ok); }
    .project-head { display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
    .project-head h2 { margin:0; font-size:18px; font-weight:600; letter-spacing:-.01em; }
    .status { font-size:12px; font-weight:500; border-radius:999px; padding:3px 10px; transition:background .3s, color .3s; }
    .status.ok { background:var(--ok-soft); color:var(--ok-text); }
    .status.pending { background:var(--pending-soft); color:var(--pending-text); }
    .status.saving { background:var(--line); color:var(--muted); }

    .split { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    @media (max-width:900px) { .split { grid-template-columns:1fr; } }
    .panel { display:flex; flex-direction:column; min-width:0; }
    .summary-wrap { position:relative; }
    .summary-wrap .summary { padding-right:40px; }
    button.copy { position:absolute; top:8px; right:8px; padding:4px; width:26px; height:26px; justify-content:center; color:var(--muted); border-color:transparent; background:var(--bg); opacity:.6; }
    .summary-wrap:hover button.copy, button.copy:focus, button.copy.done { opacity:1; }
    button.copy:hover { border-color:var(--line); background:var(--panel); color:var(--text); }
    button.copy .ico-check { display:none; color:var(--ok); }
    button.copy.done .ico-check { display:block; } button.copy.done .ico-copy { display:none; }
    .week-bar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap; padding:12px 18px; background:var(--panel); border:1px solid var(--line); box-shadow:none; }
    .week-bar .progress { margin:0; }
    button.copy-all.done { border-color:var(--ok); color:var(--ok-text); background:var(--ok-soft); }
    .panel h3 { margin:0 0 8px; font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }

    textarea { width:100%; min-height:140px; resize:none; overflow:hidden; font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13.5px; line-height:1.6; padding:12px 14px; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:10px; transition:border-color .15s, box-shadow .15s; }
    textarea::placeholder { color:var(--muted); opacity:.7; }
    textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

    .toolbar { display:flex; align-items:center; justify-content:flex-end; gap:12px; margin-top:10px; }
    .hint { font-size:13px; color:var(--pending-text); background:var(--pending-soft); border-radius:999px; padding:4px 12px; animation:fadein .15s ease; }
    @keyframes fadein { from { opacity:0; transform:translateX(4px); } to { opacity:1; transform:none; } }
    textarea.needs-input { border-color:var(--pending); box-shadow:0 0 0 3px var(--pending-soft); }
    button { font:inherit; font-weight:500; font-size:13px; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:background .15s, border-color .15s, color .15s, transform .05s; }
    button:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
    button:active { transform:translateY(1px); }
    button.primary { background:var(--text); color:var(--bg); border-color:var(--text); }
    button.primary:hover { opacity:.85; }
    button:disabled { opacity:.6; cursor:progress; }
    button svg { width:14px; height:14px; }
    .spinner { display:none; width:13px; height:13px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
    button.htmx-request .spinner { display:inline-block; }
    button.htmx-request .sparkle { display:none; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .summary { white-space:pre-wrap; line-height:1.65; font-size:15px; padding:12px 14px; background:var(--bg); border-radius:10px; border:1px solid var(--line); min-height:140px; opacity:1; transition:opacity .35s ease; }
    .summary.htmx-added { opacity:0; }
    .muted { color:var(--muted); font-size:13px; }
    .empty { color:var(--muted); font-style:italic; padding:12px 14px; border:1px dashed var(--line); border-radius:10px; min-height:140px; display:flex; align-items:center; margin:0; }
    .notice { background:var(--pending-soft); color:var(--pending-text); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:14px; }
    .notice a { color:inherit; font-weight:600; }

    .card { background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
    table { border-collapse:separate; border-spacing:0; width:100%; background:var(--panel); border-radius:var(--radius); box-shadow:var(--shadow); }
    tr:first-child th:first-child { border-top-left-radius:var(--radius); }
    tr:first-child th:last-child { border-top-right-radius:var(--radius); }
    tr:last-child td:first-child { border-bottom-left-radius:var(--radius); }
    tr:last-child td:last-child { border-bottom-right-radius:var(--radius); }
    td, th { text-align:left; padding:12px 16px; border-bottom:1px solid var(--line); }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
    tr:last-child td { border-bottom:none; }
    form.inline { display:flex; gap:10px; margin:0 0 16px; }
    form.rename { display:flex; gap:8px; align-items:center; margin:0; }
    [hidden] { display:none !important; }
    form.rename input { padding:6px 10px; min-width:220px; }
    td.actions { width:48px; text-align:right; }
    details.menu { position:relative; display:inline-block; }
    details.menu summary { list-style:none; cursor:pointer; width:30px; height:30px; display:grid; place-items:center; border-radius:8px; color:var(--muted); }
    details.menu summary::-webkit-details-marker { display:none; }
    details.menu summary:hover, details.menu[open] summary { background:var(--line); color:var(--text); }
    details.menu summary svg { width:18px; height:18px; }
    .menu-items { position:absolute; right:0; top:34px; z-index:5; min-width:140px; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:6px; display:flex; flex-direction:column; }
    .menu-items form { margin:0; display:contents; }
    .menu-items button { width:100%; justify-content:flex-start; border:none; border-radius:7px; background:transparent; padding:8px 10px; font-size:14px; }
    .menu-items button:hover { background:var(--bg); color:var(--text); }
    input[type=text] { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px; flex:1; background:var(--panel); color:var(--text); }
    .login { max-width:380px; margin:10vh auto 0; }
    .login h1 { font-size:22px; margin:0 0 4px; letter-spacing:-.01em; }
    .login .sub { margin:0 0 22px; }
    .login form { display:flex; flex-direction:column; gap:10px; }
    .login label { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .login button.primary { margin-top:6px; justify-content:center; padding:10px; font-size:14px; }
    .login button.wide { justify-content:center; width:100%; padding:10px; font-size:14px; }
    .login .or { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:12px; margin:18px 0; }
    .login .or::before, .login .or::after { content:""; flex:1; height:1px; background:var(--line); }
    .login .error { background:#fee2e2; color:#991b1b; border-radius:10px; padding:10px 14px; font-size:14px; margin-bottom:14px; }
    input[type=password], input[type=email] { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--text); width:100%; }
    input[type=password]:focus, input[type=email]:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    input[type=text]:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  </style>
</head>
<body>
<header>
  <div class="left">{% block header %}{% endblock %}</div>
  <a class="brand" href="/">Weekly Sitrep</a>
  <nav>
    <a href="/">This week</a>
    <a href="/projects">Projects</a>
    {% if user %}<span class="muted">{{ user.name }}{% if auth_mode == 'dev' %} (dev){% else %} · <a href="/auth/logout">Log out</a>{% endif %}</span>{% endif %}
    <button type="button" class="theme" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Weekly Sitrep v{{ app_version }}{% if app_build %} · {{ app_build }}{% endif %}</footer>
<script>
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme !== 'dark';
    if (dark) root.dataset.theme = 'dark'; else delete root.dataset.theme;
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
  });
  // Copy to clipboard: single summary (data-copy = selector) or all summaries on the page.
  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
    }
    btn.classList.add('done');
    const label = btn.querySelector('span'); const old = label && label.textContent;
    if (label) label.textContent = 'Copied';
    setTimeout(() => { btn.classList.remove('done'); if (label) label.textContent = old; }, 1500);
  }
  document.addEventListener('click', e => {
    const one = e.target.closest('button[data-copy]');
    if (one) { const el = document.querySelector(one.dataset.copy); if (el) copyText(el.textContent.trim(), one); return; }
    const all = e.target.closest('button[data-copy-all]');
    if (all) {
      const parts = [...document.querySelectorAll('.project')].map(card => {
        const name = card.dataset.project, sum = card.querySelector('.summary');
        return name + '\n' + (sum ? sum.textContent.trim() : '(no report this week)');
      });
      copyText('Weekly Sitrep — ' + all.dataset.week + '\n\n' + parts.join('\n\n'), all);
    }
  });
  // Generate with an empty report: show a hint instead of sending the request.
  document.addEventListener('htmx:confirm', e => {
    const btn = e.detail.elt;
    if (!btn.matches || !btn.matches('button[hx-post$="/generate"]')) return;
    const form = btn.closest('form'), ta = form.querySelector('textarea'), hint = form.querySelector('.hint');
    if (ta.value.trim()) return;
    e.preventDefault();
    hint.hidden = false; ta.classList.add('needs-input'); ta.focus();
    clearTimeout(hint._t);
    hint._t = setTimeout(() => { hint.hidden = true; ta.classList.remove('needs-input'); }, 2500);
    ta.addEventListener('input', () => { hint.hidden = true; ta.classList.remove('needs-input'); }, { once: true });
  });
  // Auto-grow textareas to fit their content.
  function grow(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
  document.querySelectorAll('textarea').forEach(grow);
  document.addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA') grow(e.target); });
  // Show "Saving…" while an auto-save request is in flight.
  document.addEventListener('htmx:beforeRequest', e => {
    const el = e.detail.elt;
    if (el.tagName === 'TEXTAREA') {
      const status = document.querySelector(el.getAttribute('hx-target'));
      if (status) status.innerHTML = '<span class="status saving">Saving…</span>';
    }
  });
</script>
</body>
</html>
